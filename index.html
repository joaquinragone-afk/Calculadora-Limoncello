<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IL TEGGIANESE</title>

    <link rel="apple-touch-icon" href="https://img.icons8.com/color/480/lemon.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/480/lemon.png">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fcfaf0; padding: 20px; text-align: center; color: #333; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; border: 2px solid #eecb58; }
        h2 { color: #b8860b; margin-bottom: 5px; }
        p.subtitle { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #555; text-align: left; margin-left: 5%; }
        select, input { width: 90%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 10px; font-size: 1.1rem; text-align: center; outline: none; transition: border-color 0.3s; box-sizing: border-box; font-family: inherit;}
        select { cursor: pointer; background-color: white; }
        select:focus, input:focus { border-color: #eecb58; }
        button { background-color: #eecb58; color: #5d4037; border: none; padding: 15px 25px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 10px; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .result { margin-top: 25px; text-align: left; background: #fffde7; padding: 20px; border-radius: 15px; border-left: 5px solid #eecb58; display: none; animation: fadeIn 0.5s; width: 90%; box-sizing: border-box; margin-left: auto; margin-right: auto;}
        .res-item { margin-bottom: 10px; font-size: 1.1rem; }
        .res-item span { font-weight: bold; color: #b8860b; }
        .highlight { background: #eecb58; color: #5d4037; padding: 10px; border-radius: 8px; margin-top: 15px; text-align: center; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .footer { margin-top: 20px; font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍋 IL TEGGIANESE</h2>
    <p class="subtitle">Calculadora de Producción - Nueva Fórmula</p>
    
    <label for="modo">¿Qué dato tenés?</label>
    <select id="modo" onchange="cambiarModo()">
        <option value="alcohol">Tengo Litros de Alcohol</option>
        <option value="agua">Tengo Litros de Agua</option>
    </select>

    <label id="label-input" for="cantidad">Litros de Alcohol (96°):</label>
    <input type="number" id="cantidad" placeholder="Ej: 6" step="0.1" inputmode="decimal">
    
    <button onclick="calcular()">CALCULAR PRODUCCIÓN</button>

    <div id="resultado" class="result">
        <div class="res-item" id="row-alcohol" style="display:none;">🍷 Alcohol a agregar: <span id="res-alcohol"></span> L</div>
        <div class="res-item" id="row-agua" style="display:none;">💧 Agua necesaria: <span id="res-agua"></span> L</div>
        <div class="res-item">🍬 Azúcar necesaria: <span id="res-azucar"></span> kg</div>
        <div class="res-item">🍯 Almíbar resultante: <span id="res-almibar"></span> L</div>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        <div class="res-item">🍶 Volumen final: <span id="res-total"></span> L</div>
        
        <div class="highlight">
            🍾 Botellas de 750ml a llenar: <span id="res-botellas"></span>
        </div>
    </div>
</div>

<div class="footer">Artesanal • Calidad Superior • Tradición Familiar</div>

<script>
    function cambiarModo() {
        const modo = document.getElementById('modo').value;
        const label = document.getElementById('label-input');
        const input = document.getElementById('cantidad');
        
        if(modo === 'alcohol') {
            label.innerText = 'Litros de Alcohol (96°):';
            input.placeholder = 'Ej: 6';
        } else {
            label.innerText = 'Litros de Agua:';
            input.placeholder = 'Ej: 30';
        }
        // Ocultar resultados si se cambia el modo para evitar confusiones
        document.getElementById('resultado').style.display = 'none';
        input.value = '';
    }

    function calcular() {
        const cantidad = parseFloat(document.getElementById('cantidad').value);
        const modo = document.getElementById('modo').value;
        
        if(cantidad > 0) {
            // Constantes físicas e indicaciones de la nueva fórmula
            const factor_volumen_azucar = 0.63; // 1kg de azucar aporta aprox 0.63 L de volumen al disolverse
            const ratio_azucar_agua = 17 / 30; // 17 kg de azucar cada 30 L de agua
            
            // Factor que nos dice cuánto volumen de almíbar se genera por cada litro de agua usado
            const factor_almibar_agua = 1 + (ratio_azucar_agua * factor_volumen_azucar); // 1 + (17/30)*0.63 = 1.357
            
            let alc, agua, azucar, vol_almibar, total, botellas;

            if (modo === 'alcohol') {
                alc = cantidad;
                // Por cada 1 L de alcohol son 2.2 L de almíbar
                vol_almibar = alc * 2.2;
                // Sabiendo el almíbar total, calculamos el agua que lo compone
                agua = vol_almibar / factor_almibar_agua;
                // Sabiendo el agua, calculamos el azúcar correspondiente a la proporción
                azucar = agua * ratio_azucar_agua;
            } else {
                agua = cantidad;
                // Calculamos el azúcar usando la proporción 17kg cada 30L
                azucar = agua * ratio_azucar_agua;
                // Sumamos el volumen real que ocupará la mezcla de agua y azúcar
                vol_almibar = agua + (azucar * factor_volumen_azucar);
                // Si cada litro de alcohol requiere 2.2L de almíbar, despejamos el alcohol
                alc = vol_almibar / 2.2;
            }

            // Totales
            total = alc + vol_almibar;
            botellas = total / 0.75;

            // Lógica para mostrar/ocultar los campos dependiendo de qué se ingresó
            if (modo === 'alcohol') {
                document.getElementById('row-alcohol').style.display = 'none';
                document.getElementById('row-agua').style.display = 'block';
            } else {
                document.getElementById('row-alcohol').style.display = 'block';
                document.getElementById('row-agua').style.display = 'none';
            }

            // Inserción de datos en el DOM con formato local
            if (modo !== 'alcohol') document.getElementById('res-alcohol').innerText = alc.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            if (modo !== 'agua') document.getElementById('res-agua').innerText = agua.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            document.getElementById('res-azucar').innerText = azucar.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('res-almibar').innerText = vol_almibar.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('res-total').innerText = total.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            // Redondeo hacia arriba para las botellas
            document.getElementById('res-botellas').innerText = Math.ceil(botellas);
            
            // Animación de aparición
            document.getElementById('resultado').style.display = 'block';
        } else {
            alert("Por favor, ingresá una cantidad válida mayor a 0.");
        }
    }
</script>

</body>
</html>
